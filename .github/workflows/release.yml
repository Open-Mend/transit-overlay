# Builds both store zips and publishes them as a GitHub Release for the
# version in manifest.json. Run it from the Actions tab ("Run workflow"),
# or push a matching tag like v0.4.1. The tag and release are created by
# github-actions, so anyone can check that the store packages match this code.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          tag="v$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME != manifest $tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: python3 build.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in manifest.json first."; exit 1
          fi
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
